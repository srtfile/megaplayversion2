# render.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Render:
#   1. New → Web Service → connect GitHub repo
#   2. Render auto-reads render.yaml — no extra config needed
#   3. After first deploy, grab the Deploy Hook URL from Settings and add it
#      as RENDER_DEPLOY_HOOK_URL in your GitHub repo secrets
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: megaplayer
    runtime: python
    region: oregon          # change to: frankfurt, singapore, ohio, virginia
    plan: free              # free | starter | standard | pro

    buildCommand: pip install -r requirements.txt
    # gthread worker class is required for SSE (Server-Sent Events) streaming
    # --workers 2 --threads 4  gives 8 concurrent requests on the free plan
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 120 --keep-alive 5

    # Persistent disk — profile.json survives redeploys (paid plans only)
    # Uncomment on starter+ and set mountPath to match BASE_DIR (/opt/render/project/src)
    # disk:
    #   name: megaplayer-data
    #   mountPath: /opt/render/project/src
    #   sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000        # Render injects $PORT automatically; this is just a hint

    healthCheckPath: /health
    autoDeploy: true
